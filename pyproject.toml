[project]
name = "mimir"
version = "0.1.0"
description = "A minimal, self-contained CLI vault for managing personal account secrets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography",
]

[project.scripts]
mimir = "mimir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
