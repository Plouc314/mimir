[project]
name = "mimir-vault"
version = "0.1.2"
description = "A minimal, self-contained CLI vault for managing personal account secrets"
readme = "README.md"
requires-python = ">=3.9.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Goumaz", email = "alexandre.k.goumaz@gmail.com" }]
keywords = ["vault", "secrets", "password", "cli", "encryption"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Environment :: Console",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=48.0",
]

[project.urls]
Homepage = "https://github.com/Plouc314/mimir"
Repository = "https://github.com/Plouc314/mimir"
PyPI = "https://pypi.org/project/mimir-vault/"

[project.scripts]
mimir = "mimir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimir"]
